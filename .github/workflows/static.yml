# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # NEW STEP: Create a single folder to merge both sites
      - name: Create Combined Directory
        run: mkdir public-site

      # NEW STEP: Copy your folders and choose your URL names
      - name: Copy Site 1 and Site 2
        run: |
          cp -r ./tree/main/HTML/プロジェクト１ ./public-site/project1
          cp -r ./tree/main/HTML/プロジェクト２ ./public-site/project2
        # Change './folder1' and './folder2' to match your actual GitHub folder names.
        # Change 'portfolio' and 'blog' to whatever you want your website URLs to be.

      # MODIFIED STEP: Upload the combined folder instead of '.'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public-site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

